<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpaceDebrisX | Collision Risk Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron&family=Inter&display=swap');

      :root {
        --bg-deep: #020205;
        --bg-panel: rgba(15, 18, 30, 0.85);
        --accent-cyan: #06b6d4;
        --accent-purple: #8b5cf6;
        --accent-red: #ef4444;
        --accent-amber: #f59e0b;
        --accent-green: #22c55e;
        --glass-border: rgba(255, 255, 255, 0.06);
        --glass-bg: rgba(15, 18, 30, 0.7);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-deep);
        color: #e2e8f0;
        overflow: hidden;
      }

      #root {
        min-height: 100vh;
        position: relative;
      }

      h1, h2, h3, h4, .font-orbitron {
        font-family: 'Orbitron', monospace;
      }

      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .glass-panel-light {
        background: rgba(15, 18, 30, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        border-radius: 8px;
      }

      .text-gradient {
        background: linear-gradient(135deg, #fff 0%, #818cf8 50%, #22d3ee 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .btn-glass {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        color: #e2e8f0;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-glass:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(6, 182, 212, 0.4);
        color: #fff;
        transform: translateY(-1px);
      }

      .btn-cyan {
        background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
        color: #fff;
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        transition: all 0.2s;
      }

      .btn-cyan:hover {
        box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
        transform: translateY(-1px);
      }

      .btn-cyan:active {
        transform: translateY(0);
      }

      .risk-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .risk-critical {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .risk-high {
        background: rgba(249, 115, 22, 0.15);
        color: #fdba74;
        border: 1px solid rgba(249, 115, 22, 0.3);
      }

      .risk-medium {
        background: rgba(234, 179, 8, 0.15);
        color: #fde047;
        border: 1px solid rgba(234, 179, 8, 0.3);
      }

      .risk-low {
        background: rgba(34, 197, 94, 0.15);
        color: #86efac;
        border: 1px solid rgba(34, 197, 94, 0.3);
      }

      .risk-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      .dot-critical { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
      .dot-high { background: #f97316; box-shadow: 0 0 8px #f97316; }
      .dot-medium { background: #eab308; box-shadow: 0 0 8px #eab308; }
      .dot-low { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

      .pulse-critical {
        animation: pulse-critical 2s infinite;
      }

      @keyframes pulse-critical {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
      }

      .pulse-high {
        animation: pulse-high 2.5s infinite;
      }

      @keyframes pulse-high {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }

      .loader {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .scan-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #06b6d4, transparent);
        opacity: 0.6;
        animation: scan 3s linear infinite;
        pointer-events: none;
        z-index: 10;
      }

      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      .orbit-ring {
        position: absolute;
        border: 1px solid rgba(6, 182, 212, 0.1);
        border-radius: 50%;
        pointer-events: none;
      }

      #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }

      .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 50;
        pointer-events: none;
      }

      .ui-interactive {
        pointer-events: auto;
      }

      .toast {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .toast-item {
        background: rgba(15, 18, 30, 0.9);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        color: #e2e8f0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        animation: slideIn 0.3s ease-out;
        min-width: 300px;
      }

      .toast-item.critical {
        border-left: 4px solid #ef4444;
      }

      .toast-item.high {
        border-left: 4px solid #f97316;
      }

      .toast-item.info {
        border-left: 4px solid #06b6d4;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(100%); }
        to { opacity: 1; transform: translateX(0); }
      }

      .stat-card {
        background: rgba(15, 18, 30, 0.6);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        padding: 1rem;
        position: relative;
        overflow: hidden;
        transition: all 0.3s;
      }

      .stat-card:hover {
        border-color: rgba(6, 182, 212, 0.3);
        transform: translateY(-2px);
      }

      .stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-color, #06b6d4), transparent);
      }

      .metric-value {
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        font-size: 1.75rem;
      }

      .metric-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
        margin-top: 0.25rem;
      }

      .table-header {
        background: rgba(0, 0, 0, 0.3);
      }

      .table-row:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .error-boundary {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        padding: 1.5rem;
        color: #fca5a5;
        text-align: center;
        margin: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.production.min.js"></script>
    <script src="https://unpkg.com/axios@1.6.0/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/UnrealBloomPass.min.js"></script>
    <script type="module">
      // ========================================================================
      // CONFIGURATION & API
      // ========================================================================
      const API_BASE = '/api';
      const SOCKET_URL = window.location.protocol === 'https:' ? 'wss:' : 'ws:' + window.location.host;
      const DEMO_CREDENTIALS = [
        { username: 'admin', password: 'admin', role: 'ADMIN' },
        { username: 'analyst', password: 'analyst', role: 'ANALYST' },
        { username: 'operator', password: 'operator', role: 'OPERATOR' },
      ];

      const api = axios.create({
        baseURL: API_BASE,
        headers: { 'Content-Type': 'application/json' },
      });

      api.interceptors.request.use((config) => {
        const token = localStorage.getItem('sd_token');
        if (token) config.headers.Authorization = `Bearer ${token}`;
        return config;
      });

      // ========================================================================
      // UTILITIES
      // ========================================================================
      const formatPoc = (poc) => {
        if (!poc) return '—';
        return poc.toExponential(2);
      };

      const riskColor = (level) => {
        switch (level) {
          case 'CRITICAL': return '#ef4444';
          case 'HIGH': return '#f97316';
          case 'MEDIUM': return '#eab308';
          case 'LOW': return '#22c55e';
          default: return '#94a3b8';
        }
      };

      const riskBadge = (level) => {
        const colors = {
          CRITICAL: 'risk-critical dot-critical',
          HIGH: 'risk-high dot-high',
          MEDIUM: 'risk-medium dot-medium',
          LOW: 'risk-low dot-low',
        };
        const cls = colors[level] || 'risk-low dot-low';
        return `<span class="risk-badge ${cls}"><span class="risk-dot ${level.toLowerCase()}"></span>${level}</span>`;
      };

      // ========================================================================
      // THREE.JS GLOBE COMPONENT
      // ========================================================================
      class GlobeOrbitalView {
        constructor(containerId, options = {}) {
          this.container = document.getElementById(containerId);
          this.options = {
            earthRadius: 50,
            atmosphereHeight: 55,
            ...options,
          };
          this.scene = null;
          this.camera = null;
          this.renderer = null;
          this.controls = null;
          this.composer = null;
          this.earthMesh = null;
          this.cloudsMesh = null;
          this.starField = null;
          this.objects = [];
          this.objectMeshes = new Map();
          this.orbitLines = new Map();
          this.raycaster = new THREE.Raycaster();
          this.mouse = new THREE.Vector2();
          this.animationId = null;
          this.isDisposed = false;
          this.onObjectClick = options.onObjectClick || (() => {});
          this.clock = new THREE.Clock();
          this.time = 0;

          this.init();
          this.animate();
        }

        init() {
          // Scene
          this.scene = new THREE.Scene();
          this.scene.fog = new THREE.FogExp2(0x020205, 0.002);

          // Camera
          const aspect = this.container.clientWidth / this.container.clientHeight || 16 / 9;
          this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 2000);
          this.camera.position.set(0, 120, 220);

          // Renderer
          this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          this.renderer.shadowMap.enabled = true;
          this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          this.renderer.toneMapping = THREE.ReinhardToneMapping;
          this.container.appendChild(this.renderer.domElement);

          // Post-processing (bloom)
          this.composer = new THREE.EffectComposer(this.renderer);
          this.composer.addPass(new THREE.RenderPass(this.scene, this.camera));
          const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(this.container.clientWidth, this.container.clientHeight),
            1.5, 0.4, 0.85
          );
          this.composer.addPass(bloomPass);

          // Controls
          this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.05;
          this.controls.rotateSpeed = 0.5;
          this.controls.zoomSpeed = 0.8;
          this.controls.minDistance = 80;
          this.controls.maxDistance = 500;
          this.controls.autoRotate = false;
          this.controls.autoRotateSpeed = 0.5;

          // Lights
          const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
          this.scene.add(ambientLight);

          const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
          sunLight.position.set(200, 100, 150);
          sunLight.castShadow = true;
          this.scene.add(sunLight);

          const rimLight = new THREE.SpotLight(0x06b6d4, 0.5);
          rimLight.position.set(-100, -50, -100);
          rimLight.lookAt(0, 0, 0);
          this.scene.add(rimLight);

          // Stars
          this.createStars();

          // Earth
          this.createEarth();

          // Atmosphere glow
          this.createAtmosphere();

          // Grid / grid helper (subtle)
          const gridHelper = new THREE.GridHelper(400, 40, 0x06b6d4, 0x020205);
          gridHelper.position.y = -60;
          gridHelper.material.opacity = 0.15;
          gridHelper.material.transparent = true;
          this.scene.add(gridHelper);

          // Event listeners
          window.addEventListener('resize', () => this.onResize());
          this.container.addEventListener('click', (e) => this.onClick(e));
        }

        createStars() {
          const geometry = new THREE.BufferGeometry();
          const vertices = [];
          for (let i = 0; i < 3000; i++) {
            vertices.push(
              (Math.random() - 0.5) * 2000,
              (Math.random() - 0.5) * 2000,
              (Math.random() - 0.5) * 2000
            );
          }
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
          const material = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.7,
            transparent: true,
            opacity: 0.8,
          });
          this.starField = new THREE.Points(geometry, material);
          this.scene.add(this.starField);
        }

        createEarth() {
          // Sphere geometry
          const geometry = new THREE.SphereGeometry(this.options.earthRadius, 64, 64);

          // Create a procedural earth texture (canvas)
          const canvas = document.createElement('canvas');
          canvas.width = 1024;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');

          // Deep ocean
          ctx.fillStyle = '#0a192f';
          ctx.fillRect(0, 0, 1024, 512);

          // Continents (procedural blobs)
          ctx.fillStyle = '#1e3a8a';
          for (let i = 0; i < 60; i++) {
            const x = Math.random() * 1024;
            const y = Math.random() * 512;
            const r = 10 + Math.random() * 40;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }

          // City lights (night side) - subtle yellow dots
          ctx.fillStyle = '#fde047';
          for (let i = 0; i < 300; i++) {
            const x = Math.random() * 1024;
            const y = Math.random() * 512;
            const r = 0.5 + Math.random() * 2;
            ctx.globalAlpha = 0.3 + Math.random() * 0.5;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;

          const material = new THREE.MeshStandardMaterial({
            map: texture,
            roughness: 0.7,
            metalness: 0.1,
            bumpMap: texture,
            bumpScale: 0.05,
          });

          this.earthMesh = new THREE.Mesh(geometry, material);
          this.earthMesh.castShadow = true;
          this.earthMesh.receiveShadow = true;
          this.scene.add(this.earthMesh);

          // Clouds layer
          const cloudGeo = new THREE.SphereGeometry(this.options.earthRadius * 1.02, 64, 64);
          const cloudMat = new THREE.MeshStandardMaterial({
            map: texture,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
          });
          this.cloudsMesh = new THREE.Mesh(cloudGeo, cloudMat);
          this.scene.add(this.cloudsMesh);
        }

        createAtmosphere() {
          const geo = new THREE.SphereGeometry(this.options.atmosphereHeight, 64, 64);
          const mat = new THREE.MeshBasicMaterial({
            color: 0x06b6d4,
            transparent: true,
            opacity: 0.12,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
          });
          const atmosphere = new THREE.Mesh(geo, mat);
          this.scene.add(atmosphere);
        }

        addObject(obj) {
          if (this.objectMeshes.has(obj.id)) return;
          const { id, name, object_type, lon_deg, lat_deg, alt_km } = obj;

          // Determine color by type
          let color;
          switch (object_type) {
            case 'SATELLITE': color = 0x06b6d4; break;
            case 'DEBRIS': color = 0xf43f5e; break;
            case 'ROCKET_BODY': color = 0xeab308; break;
            default: color = 0x94a3b8;
          }

          const radius = object_type === 'DEBRIS' ? 0.8 : 1.2;
          const geo = new THREE.SphereGeometry(radius, 16, 16);
          const mat = new THREE.MeshBasicMaterial({ color });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.userData = { id, name, object_type, lon_deg, lat_deg, alt_km };
          this.scene.add(mesh);
          this.objectMeshes.set(id, mesh);

          // Orbit line
          const orbitGeo = new THREE.RingGeometry(
            this.options.earthRadius + alt_km / 20,
            this.options.earthRadius + alt_km / 20 + 0.1,
            128
          );
          const orbitMat = new THREE.MeshBasicMaterial({
            color: object_type === 'DEBRIS' ? 0xf43f5e : 0x06b6d4,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide,
          });
          const orbitLine = new THREE.Mesh(orbitGeo, orbitMat);
          orbitLine.rotation.x = -Math.PI / 2;
          this.scene.add(orbitLine);
          this.orbitLines.set(id, orbitLine);

          this.updateObjectPosition(mesh, orbitLine, lon_deg, lat_deg, alt_km);
        }

        updateObjectPosition(mesh, orbitLine, lon_deg, lat_deg, alt_km) {
          const R = this.options.earthRadius + (alt_km || 450) / 20;
          const lat = (lat_deg || 0) * (Math.PI / 180);
          const lon = (lon_deg || 0) * (Math.PI / 180);

          const x = R * Math.cos(lat) * Math.cos(lon);
          const y = R * Math.sin(lat);
          const z = R * Math.cos(lat) * Math.sin(lon);

          mesh.position.set(x, y, z);
          mesh.lookAt(new THREE.Vector3(0, 0, 0));

          if (orbitLine) {
            orbitLine.scale.set(1, 1, 1);
          }
        }

        updateObjects(objects) {
          const incomingIds = new Set(objects.map((o) => o.id));

          // Remove deleted objects
          for (const [id, mesh] of this.objectMeshes.entries()) {
            if (!incomingIds.has(id)) {
              this.scene.remove(mesh);
              this.objectMeshes.delete(id);
              const orbit = this.orbitLines.get(id);
              if (orbit) {
                this.scene.remove(orbit);
                this.orbitLines.delete(id);
              }
            }
          }

          // Add/update objects
          objects.forEach((obj) => {
            const mesh = this.objectMeshes.get(obj.id);
            const orbit = this.orbitLines.get(obj.id);
            if (mesh && orbit) {
              this.updateObjectPosition(mesh, orbit, obj.lon_deg, obj.lat_deg, obj.alt_km);
            } else {
              this.addObject(obj);
            }
          });

          this.objects = objects;
        }

        rotateEarth(delta) {
          if (this.earthMesh) this.earthMesh.rotation.y += delta * 0.02;
          if (this.cloudsMesh) this.cloudsMesh.rotation.y += delta * 0.03;
        }

        onClick(event) {
          // Calculate mouse position in normalized device coordinates
          const rect = this.renderer.domElement.getBoundingClientRect();
          this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

          this.raycaster.setFromCamera(this.mouse, this.camera);

          const intersected = this.raycaster.intersectObjects(
            Array.from(this.objectMeshes.values())
          );

          if (intersected.length > 0) {
            const obj = intersected[0].object.userData;
            this.onObjectClick(obj);
          }
        }

        onResize() {
          const width = this.container.clientWidth;
          const height = this.container.clientHeight;
          if (!width || !height) return;

          this.camera.aspect = width / height;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(width, height);
          this.composer.setSize(width, height);
        }

        animate() {
          if (this.isDisposed) return;
          this.animationId = requestAnimationFrame(() => this.animate());

          const delta = this.clock.getDelta();
          this.time += delta;

          // Auto-rotate earth slowly
          this.rotateEarth(delta);

          // Slowly rotate clouds faster
          if (this.cloudsMesh) this.cloudsMesh.rotation.y += delta * 0.015;

          this.controls.update();
          this.composer.render();
        }

        setCameraPosition(pos, target) {
          if (pos) this.camera.position.copy(pos);
          if (target) this.controls.target.copy(target);
          this.controls.update();
        }

        dispose() {
          this.isDisposed = true;
          if (this.animationId) cancelAnimationFrame(this.animationId);
          window.removeEventListener('resize', this.onResize);
          this.container.removeEventListener('click', this.onClick);
          if (this.renderer) this.renderer.dispose();
          if (this.composer) this.composer.dispose();
          this.scene.traverse((object) => {
            if (object.geometry) object.geometry.dispose();
            if (object.material) object.material.dispose();
          });
        }
      }

      // ========================================================================
      // SIMULATION ENGINE (client-side orbital propagation)
      // ========================================================================
      class SimulationEngine {
        constructor() {
          this.objects = [];
          this.running = false;
          this.speed = 1;
          this.lastTime = null;
          this.callbacks = [];
          this.intervalId = null;
        }

        init(objects) {
          this.objects = objects.map((o) => ({
            ...o,
            lon_deg: o.lon_deg || (o.id * 37) % 360,
            lat_deg: o.lat_deg || 0,
            alt_km: o.alt_km || 450,
            velocity: 7.5 + Math.random() * 0.5, // km/s
            inclination: Math.random() * 30,
          }));
        }

        start() {
          if (this.running) return;
          this.running = true;
          this.lastTime = performance.now();
          this.tick();
        }

        stop() {
          this.running = false;
        }

        tick() {
          if (!this.running) return;

          const now = performance.now();
          const dt = (now - this.lastTime) / 1000;
          this.lastTime = now;

          // Update positions (simplified orbital propagation)
          this.objects.forEach((obj) => {
            // Move longitude based on velocity and altitude
            const angularVel = (obj.velocity / (6378 + obj.alt_km)) * (180 / Math.PI);
            obj.lon_deg = (obj.lon_deg + angularVel * dt * this.speed) % 360;
            if (obj.lon_deg < 0) obj.lon_deg += 360;

            // Slight latitude oscillation
            obj.lat_deg =
              Math.sin((now / 1000) * 0.5 + obj.inclination) *
              Math.abs(Math.sin(obj.inclination * (Math.PI / 180))) *
              30;
          });

          this.callbacks.forEach((cb) => cb(this.objects));

          this.intervalId = requestAnimationFrame(() => this.tick());
        }

        setSpeed(speed) {
          this.speed = speed;
        }

        onUpdate(callback) {
          this.callbacks.push(callback);
        }

        getObjects() {
          return this.objects;
        }
      }

      // Error Boundary
      class ErrorBoundary extends React.Component {
        state = { hasError: false, error: null };

        static getDerivedStateFromError(error) {
          return { hasError: true, error };

        componentDidCatch(error, errorInfo) {
          console.error('Error boundary caught:', error, errorInfo);
          window.showError?.(error.message || 'An unexpected error occurred');
        }

        render() {
          if (this.state.hasError) {
            return (
              <div className="error-boundary">
                <h3 className="text-lg font-bold mb-2">⚠️ System Error</h3>
                <p className="text-sm mb-3">{this.state.error?.message || 'An unexpected error occurred'}</p>

                    this.setState({ hasError: false, error: null });
                    window.location.reload();
                  }}
                  className="btn-cyan px-4 py-2 text-sm rounded"

          }
          return this.props.children;

        };

        return (
          <div className="relative w-full h-full">
            <div
              id="globe-canvas"
              ref={globeRef}
              className="w-full h-full"
              onClick={(e) => {
                if (globeRef.current) globeRef.current.onClick(e);
              }}
            ></div>

            {/* Overlay UI */}
            <div className="absolute top-6 left-6 z-10 glass-panel p-4 rounded-xl">
              <h2 className="text-lg font-bold text-white font-orbitron mb-2">
                Live Orbital View
              </h2>
              <p className="text-xs text-slate-400 mb-3">
                Real-time SGP4 propagation • {conjunctions.length} conjunctions screened
              </p>
              <div className="flex gap-2">
                <button
                  onClick={() => {
                    if (globeRef.current) {
                      globeRef.current.setCameraPosition(
                        new THREE.Vector3(0, 100, 150),
                        new THREE.Vector3(0, 0, 0)
                      );
                    }
                  }}
                  className="btn-cyan px-3 py-1.5 rounded text-sm"
                >
                  Reset View
                </button>
              </div>
            </div>
          </div>
        );
      }

      // Conjunctions Component
      function Conjunctions() {
        const [conjunctions, setConjunctions] = useState([]);
        const [loading, setLoading] = useState(false);
        const [filter, setFilter] = useState('ALL');

        const loadData = async () => {
          setLoading(true);
          try {
            const res = await api.get('/conjunctions', {
              params: filter !== 'ALL' ? { riskLevel: filter } : undefined,
            });
            setConjunctions(res.data || []);
          } catch (e) {
            window.showToast?.('Failed to load conjunctions', 'critical');
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          loadData();
        }, [filter]);

        const handleAcknowledge = async (id) => {
          try {
            await api.post(`/conjunctions/${id}/acknowledge`);
            setConjunctions((prev) =>
              prev.map((c) =>
                c.id === id ? { ...c, is_acknowledged: true } : c
              )
            );
            window.showToast?.('Conjunction acknowledged', 'info');
          } catch (e) {
            window.showToast?.('Failed to acknowledge', 'critical');
          }
        };

        const filtered = conjunctions.filter(
          (c) => filter === 'ALL' || c.risk_level === filter
        );

        return (
          <div className="p-6">
            <div className="flex items-center justify-between mb-6">
              <div>
                <h1 className="text-2xl font-bold text-white font-orbitron">
                  Conjunction Analysis
                </h1>
                <p className="text-slate-400 text-sm">
                  Pairwise trajectory intersections &amp; collision risk events
                </p>
              </div>
              <button
                onClick={() => {
                  setLoading(true);
                  api.post('/risk/scan').then(() => {
                    loadData();
                    setLoading(false);
                  });
                }}
                className="btn-cyan px-5 py-2 rounded-lg text-sm font-semibold flex items-center gap-2"
              >
                <i className="fas fa-sync-alt"></i> Rescan
              </button>
            </div>

            <div className="glass-panel p-6">
              <div className="flex flex-wrap gap-2 mb-6">
                {['ALL', 'CRITICAL', 'HIGH', 'MEDIUM', 'LOW'].map((f) => (
                  <button
                    key={f}
                    onClick={() => setFilter(f)}
                    className={`px-3 py-1.5 rounded text-sm font-medium transition-all ${
                      filter === f
                        ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/40'
                        : 'bg-white/5 text-slate-400 border border-white/10 hover:bg-white/10 hover:text-white'
                    }`}
                  >
                    {f}
                  </button>
                ))}
              </div>

              {loading ? (
                <div className="flex justify-center py-10">
                  <div className="loader"></div>
                </div>
              ) : filtered.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-12 text-center">
                  <div className="w-16 h-16 rounded-full bg-green-500/10 flex items-center justify-center mx-auto mb-4 text-green-400">
                    <i className="fas fa-check-circle text-2xl"></i>
                  </div>
                  <h3 className="text-lg font-bold text-white mb-2">All Clear</h3>
                  <p className="text-slate-400">No conjunctions detected.</p>
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead className="table-header">
                      <tr>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">ID</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">Primary</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">Secondary</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">TCA</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">Distance</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">PoC</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">Risk</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">Status</th>
                        <th className="pb-3 text-xs font-bold text-slate-400 uppercase">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.map((c) => (
                        <tr key={c.id} className="table-row border-b border-white/5 hover:bg-white/3">
                          <td className="py-3 text-sm text-slate-300 font-mono">
                            #{c.id}
                          </td>
                          <td className="py-3 text-sm text-slate-300">
                            Obj #{c.primary_object_id}
                          </td>
                          <td className="py-3 text-sm text-slate-300">
                            Obj #{c.secondary_object_id}
                          </td>
                          <td className="py-3 text-sm text-slate-300 font-mono">
                            {new Date(c.tca).toLocaleString()}
                          </td>
                          <td className="py-3 text-sm text-slate-300">
                            {c.min_distance_km?.toFixed(2)} km
                          </td>
                          <td className="py-3 text-sm text-slate-300 font-mono">
                            {c.poc ? formatPoc(c.poc) : '—'}
                          </td>
                          <td className="py-3 text-sm">
                            {riskBadge(c.risk_level)}
                          </td>
                          <td className="py-3 text-sm">
                            <span className={`px-2 py-1 rounded text-xs font-bold ${
                              c.is_acknowledged
                                ? 'bg-green-500/10 text-green-400 border border-green-500/20'
                                : 'bg-red-500/10 text-red-400 border border-red-500/20'
                            }`}>
                              {c.is_acknowledged ? 'Cleared' : 'Active'}
                            </span>
                          </td>
                          <td className="py-3 text-sm">
                            {!c.is_acknowledged && (
                              <button
                                onClick={() => handleAcknowledge(c.id)}
                                className="btn-cyan px-3 py-1 rounded text-xs"
                              >
                                Acknowledge
                              </button>
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </div>
        );
      }

      // Mitigation Component
      function Mitigation() {
        const [result, setResult] = useState(null);
        const [loading, setLoading] = useState(false);
        const [missDistance, setMissDistance] = useState('5.0');
        const [requiredDistance, setRequiredDistance] = useState('10.0');

        const calculate = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            const res = await api.post('/risk/calculate-dv', {
              missDistanceKm: parseFloat(missDistance),
              requiredMissDistanceKm: parseFloat(requiredDistance),
            });
            setResult(res.data);
          } catch (err) {
            window.showToast?.('Calculation failed: ' + err.message, 'critical');
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="p-6 max-w-2xl mx-auto">
            <div className="flex items-center justify-between mb-6">
              <div>
                <h1 className="text-2xl font-bold text-white font-orbitron">
                  Maneuver Planner
                </h1>
                <p className="text-slate-400 text-sm">
                  Collision avoidance delta-v calculation &amp; trajectory planning
                </p>
              </div>
            </div>

            <div className="glass-panel p-6">
              <h2 className="text-lg font-bold text-white mb-4 font-orbitron">
                <i className="fas fa-rocket mr-2 text-cyan-400"></i>Delta-v Calculator
              </h2>
              <form onSubmit={calculate} className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div className="flex flex-col gap-2">
                  <label className="text-xs font-bold text-slate-400 uppercase">
                    Current Miss Distance (km)
                  </label>
                  <input
                    type="number"
                    step="0.1"
                    value={missDistance}
                    onChange={(e) => setMissDistance(e.target.value)}
                    className="bg-black/50 border border-white/10 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-400"
                  />
                </div>
                <div className="flex flex-col gap-2">
                  <label className="text-xs font-bold text-slate-400 uppercase">
                    Required Miss Distance (km)
                  </label>
                  <input
                    type="number"
                    step="0.1"
                    value={requiredDistance}
                    onChange={(e) => setRequiredDistance(e.target.value)}
                    className="bg-black/50 border border-white/10 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-400"
                  />
                </div>
                <div className="flex h-10 w-full justify-center items-center">
                  <button
                    type="submit"
                    disabled={loading}
                    className="btn-cyan px-6 py-2 rounded-lg text-sm font-semibold disabled:opacity-50"
                  >
                    {loading ? 'Calculating...' : 'Compute Δv'}
                  </button>
                </div>
              </form>
            </div>

            {result && (
              <div className="mt-6 glass-panel p-6 border border-cyan-500/30">
                <h2 className="text-lg font-bold text-cyan-400 mb-4 font-orbitron">
                  Recommended Maneuver
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-black/30 rounded-lg p-4 border border-white/10">
                    <p className="text-xs font-bold text-slate-400 uppercase">Required Delta-v</p>
                    <p className="text-xl font-mono font-bold text-cyan-400">
                      {result.toFixed(4)} m/s
                    </p>
                  </div>
                  <div className="bg-black/30 rounded-lg p-4 border border-white/10">
                    <p className="text-xs font-bold text-slate-400 uppercase">Direction</p>
                    <p className="text-xl font-mono font-bold text-green-400">Prograde</p>
                  </div>
                  <div className="bg-black/30 rounded-lg p-4 border border-white/10">
                    <p className="text-xs font-bold text-slate-400 uppercase">Burn Time</p>
                    <p className="text-xl font-mono font-bold text-blue-400">~10 seconds</p>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      // Alerts Component
      function Alerts() {
        const [alerts, setAlerts] = useState([]);
        const [loading, setLoading] = useState(false);

        const loadAlerts = async () => {
          setLoading(true);
          try {
            const res = await api.get('/alerts');
            setAlerts(res.data || []);
          } catch (e) {
            window.showToast?.('Failed to load alerts', 'critical');
          } finally {
            setLoading(false);
          }
        };

        useEffect(() => {
          loadAlerts();
        }, []);

        return (
          <div className="p-6">
            <h1 className="text-2xl font-bold text-white font-orbitron mb-6">
              Alert Center
            </h1>
            <div className="glass-panel p-6">
              {loading ? (
                <div className="flex justify-center py-10">
                  <div className="loader"></div>
                </div>
              ) : alerts.length === 0 ? (
                <div className="flex flex-col items-center justify-center py-12 text-center">
                  <div className="w-16 h-16 rounded-full bg-green-500/10 flex items-center justify-center mx-auto mb-4 text-green-400">
                    <i className="fas fa-check-circle text-2xl"></i>
                  </div>
                  <h3 className="text-lg font-bold text-white mb-2">No Alerts</h3>
                  <p className="text-slate-400">All systems nominal.</p>
                </div>
              ) : (
                <div className="space-y-3">
                  {alerts.map((a) => (
                    <div key={a.id} className="p-4 rounded-lg border-l-4 bg-black/40 border-white/5">
                      <div className="flex items-center justify-between mb-2">
                        <span className={`text-xs font-bold uppercase ${
                          a.severity === 'CRITICAL' ? 'text-red-400' :
                          a.severity === 'WARNING' ? 'text-orange-400' : 'text-blue-400'
                        }`}>
                          {a.severity}
                        </span>
                        <span className="text-xs text-slate-500 font-mono">
                          {new Date(a.sent_at).toLocaleString()}
                        </span>
                      </div>
                      <p className="text-sm text-slate-300">{a.message}</p>
                      <div className="mt-2 flex items-center gap-2">
                        <span className="text-xs text-slate-500">Channel: {a.channel}</span>
                        <span className="text-xs text-slate-500">ID: #{a.id}</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        );
      }

      // Login Component
      function Login() {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);
        const { login } = useAuth();
        const navigate = useNavigate();

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);
          setError('');
          try {
            await login(username, password);
            navigate('/');
          } catch (err) {
            setError(err.response?.data?.error || 'Login failed');
          } finally {
            setLoading(false);
          }
        };

        return (
          <div className="flex items-center justify-center min-h-full bg-black">
            <div className="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl">
              <div className="text-center mb-8">
                <div className="w-12 h-12 rounded-lg bg-cyan-500/20 flex items-center justify-center mx-auto mb-4 text-cyan-400">
                  <i className="fas fa-satellite text-xl"></i>
                </div>
                <h1 className="text-2xl font-bold text-white font-orbitron">
                  SpaceDebris<span className="text-cyan-400">X</span>
                </h1>
                <p className="text-slate-400 text-sm mt-2">
                  Collision Risk Management System
                </p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-400 uppercase mb-1">
                    Username
                  </label>
                  <input
                    type="text"
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-400"
                    placeholder="admin"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-400 uppercase mb-1">
                    Password
                  </label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-black/40 border border-white/10 rounded px-3 py-2 text-white focus:outline-none focus:border-cyan-400"
                    placeholder="••••••••"
                    required
                  />
                </div>
                {error && (
                  <div className="mb-4 p-3 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
                    {error}
                  </div>
                )}
                <button
                  type="submit"
                  disabled={loading}
                  className="btn-cyan w-full py-2.5 rounded-lg text-sm font-semibold disabled:opacity-50"
                >
                  {loading ? 'Signing in...' : 'Sign In'}
                </button>
              </form>

              <div className="mt-8 border-t border-white/10 pt-6">
                <h3 className="text-xs font-bold text-slate-500 uppercase mb-4">
                  Demo Credentials
                </h3>
                <div className="space-y-2">
                  {DEMO_CREDENTIALS.map((c) => (
                    <div key={c.username} className="flex justify-between items-center text-sm">
                      <span className="text-slate-300">{c.username}</span>
                      <span className="font-mono text-cyan-400">{c.password}</span>
                      <span className="text-xs bg-black/30 px-2 py-0.5 rounded border border-white/10">
                        {c.role}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      // App Router
      function AppRouter() {
        const { user, loading: authLoading } = useAuth();

        if (authLoading) {
          return (
            <div className="flex items-center justify-center min-h-full bg-black">
              <div className="loader"></div>
            </div>
          );
        }

        return (
          <BrowserRouter>
            <ToastContainer />
            <Navbar />
            {user ? (
              <Routes>
                <Route path="/" element={<ErrorBoundary><Dashboard /></ErrorBoundary>} />
                <Route path="/login" element={<Login />} />
                <Route path="/globe" element={<ErrorBoundary><OrbitalView /></ErrorBoundary>} />
                <Route path="/conjunctions" element={<ErrorBoundary><Conjunctions /></ErrorBoundary>} />
                <Route path="/mitigation" element={<ErrorBoundary><Mitigation /></ErrorBoundary>} />
                <Route path="/alerts" element={<ErrorBoundary><Alerts /></ErrorBoundary>} />
              </Routes>
            ) : (
              <Routes>
                <Route path="/" element={<Navigate to="/login" replace />} />
                <Route path="/login" element={<Login />} />
              </Routes>
            )}
          </BrowserRouter>
        );
      }

      // ========================================================================
      // BOOTSTRAP
      // ========================================================================
      function App() {
        return (
          <AuthProvider>
            <ErrorBoundary>
              <AppRouter />
            </ErrorBoundary>
          </AuthProvider>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
