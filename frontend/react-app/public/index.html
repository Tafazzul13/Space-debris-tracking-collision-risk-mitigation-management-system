      this.objects = objects.map(o => ({
        ...o,
        lon_deg: o.lon_deg || (o.id * 37) % 360,
        lat_deg: o.lat_deg || 0,
        alt_km: o.alt_km || 450,
        velocity: 7.5 + Math.random() * 0.5,
        inclination: Math.random() * 30,
      }));
    }
    start() {
      if (this.running) return;
      this.running = true;
      this.lastTime = performance.now();
      this.tick();
    }
    stop() { this.running = false; }
    tick() {
      if (!this.running) return;
      const now = performance.now();
      const dt = (now - this.lastTime) / 1000;
      this.lastTime = now;
      this.objects.forEach(o => {
        o.lon_deg = (o.lon_deg + (o.velocity / (6378 + o.alt_km)) * (180 / Math.PI) * dt * this.speed) % 360;

      this.callbacks.forEach(cb => cb(this.objects));
      this.intervalId = requestAnimationFrame(() => this.tick());
    }

    onUpdate(cb) { this.callbacks.push(cb); }
